name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (lint)
        run: ruff check src tests

      - name: Run Ruff (format check)
        run: ruff format --check src tests

      - name: Run mypy
        run: mypy src/nfe2pdf

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m unit -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest -m integration -v --tb=short

  build-executable:
    name: Build Executable (Windows)
    runs-on: windows-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build executable with PyInstaller
        run: python scripts/build_exe.py

      - name: Verify executable exists
        run: |
          if (Test-Path dist\nfe2pdf.exe) {
            $size = (Get-Item dist\nfe2pdf.exe).Length / 1MB
            Write-Host "Executable found: dist\nfe2pdf.exe ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "Executable not found!"
            exit 1
          }

      - name: Test executable basic functionality
        run: |
          .\dist\nfe2pdf.exe --version
          .\dist\nfe2pdf.exe --help

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfe2pdf-windows-executable
          path: dist/nfe2pdf.exe
          retention-days: 30

  build-installer:
    name: Build Installer (Windows)
    runs-on: windows-latest
    needs: [build-executable]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: nfe2pdf-windows-executable
          path: dist/

      - name: Install Inno Setup
        run: |
          $installerUrl = "https://jrsoftware.org/download.php/is.exe"
          $installerPath = "$env:TEMP\is.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          & $installerPath /VERYSILENT /NORESTART /SUPPRESSMSGBOXES /LOG="$env:TEMP\innosetup.log"
          Write-Host "Inno Setup installed"

      - name: Build installer
        run: python scripts/build_installer.py

      - name: Verify installer exists
        run: |
          $installers = Get-ChildItem installer_output\*.exe
          if ($installers.Count -gt 0) {
            foreach ($inst in $installers) {
              $size = $inst.Length / 1MB
              Write-Host "Installer found: $($inst.FullName) ($([math]::Round($size, 1)) MB)"
            }
          } else {
            Write-Error "No installer found!"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfe2pdf-windows-installer
          path: installer_output/*.exe
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-executable, build-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.sha, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: nfe2pdf-windows-executable
          path: dist/

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: nfe2pdf-windows-installer
          path: installer_output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/nfe2pdf.exe
            installer_output/nfe2pdf_setup_*.exe